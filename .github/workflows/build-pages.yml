name: Build pages

on:
  push:
    paths:
      - 'about/**'
      - 'build_about.py'
      - 'img/gallery/gallery.txt'
      - 'build_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build pages from source files
        run: |
          python build_about.py
          python build_gallery.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html gallery.html
          if ! git diff --cached --quiet; then
            git commit -m "build(chore): auto-update pages from source files"
            git push
          fi