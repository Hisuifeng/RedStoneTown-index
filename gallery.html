    <!-- ========== 图片放大查看 ========== -->
    <div class="lightbox" aria-hidden="true">
        <div class="lightbox-frame">
            <button class="lightbox-close" type="button" aria-label="关闭">&times;</button>
            <img src="" alt="">
            <p class="lightbox-caption"></p>
        </div>
    </div>

    <script>
        (function () {
            var box = document.querySelector('.lightbox');
            var boxImg = box.querySelector('img');
            var boxCap = box.querySelector('.lightbox-caption');
            var closeBtn = box.querySelector('.lightbox-close');
            var last = null;

            document.querySelectorAll('.gallery-card').forEach(function (card) {
                card.addEventListener('click', function () {
                    var img = card.querySelector('img');
                    var cap = card.querySelector('figcaption');
                    boxImg.src = img.getAttribute('src');
                    boxImg.alt = img.getAttribute('alt') || '';
                    boxCap.textContent = cap ? cap.textContent : '';
                    box.setAttribute('aria-hidden', 'false');
                    box.classList.add('open');
                    last = card;
                });
            });

            function close() {
                box.classList.remove('open');
                box.setAttribute('aria-hidden', 'true');
            }

            closeBtn.addEventListener('click', close);
            box.addEventListener('click', function (e) {
                if (e.target === box) close();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') close();
            });
        })();
    </script>
